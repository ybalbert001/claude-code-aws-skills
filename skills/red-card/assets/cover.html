<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面图</title>
    <link rel="stylesheet" href="xiaohongshu.css">
</head>
<body>
    <div class="card cover-card">
        <!-- YouTube 视频截图区域 -->
        <div class="youtube-section">
            <img src="{{YOUTUBE_THUMBNAIL}}" alt="视频截图" class="youtube-thumbnail">
        </div>

        <!-- 标题和引言区域 -->
        <div class="title-section">
            <h1 class="main-title">{{TITLE}}</h1>
            <p class="intro-text">{{INTRO}}</p>
        </div>

        <!-- 小红书账号水印 -->
        <div class="watermark">
            <span class="watermark-text">小红书号: {{ACCOUNT_ID}}</span>
        </div>
    </div>
</body>
</html>
